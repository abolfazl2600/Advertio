apply plugin: 'com.android.application'

// Private sideload release only. Secrets are injected, never committed.
def releaseInputs = [
    store: System.getenv('ADVERTIO_RELEASE_KEYSTORE'),
    storePassword: System.getenv('ADVERTIO_RELEASE_STORE_PASSWORD'),
    alias: System.getenv('ADVERTIO_RELEASE_KEY_ALIAS'),
    keyPassword: System.getenv('ADVERTIO_RELEASE_KEY_PASSWORD')
]
def hasReleaseSigning = releaseInputs.values().every { it != null && !it.trim().isEmpty() }

// GitHub Actions injects a unique version for every run *and* rerun.
// Local debug builds retain the previous version; release never uses that fallback.
def injectedVersionCode = System.getenv('ADVERTIO_VERSION_CODE')
def injectedVersionName = System.getenv('ADVERTIO_VERSION_NAME')
def hasInjectedVersion = injectedVersionCode != null && injectedVersionName != null
if ((injectedVersionCode != null) != (injectedVersionName != null)) {
    throw new GradleException('Android versionCode and versionName must be supplied together')
}
if (hasInjectedVersion) {
    if (!(injectedVersionCode ==~ /[1-9][0-9]*/ && injectedVersionName ==~ /1\.0\.[1-9][0-9]*\.[1-9][0-9]*/)) {
        throw new GradleException('Invalid Android release version metadata')
    }
    if (injectedVersionCode.toBigInteger() > 2100000000) {
        throw new GradleException('Android versionCode exceeds the allowed limit')
    }
}
def configuredVersionCode = hasInjectedVersion ? injectedVersionCode.toInteger() : 3
def configuredVersionName = hasInjectedVersion ? injectedVersionName : '1.0.1'

android {
    namespace = "com.advertio.development"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.advertio.development"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode configuredVersionCode
        versionName configuredVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        privateRelease {
            if (hasReleaseSigning) {
                storeFile file(releaseInputs.store)
                storePassword releaseInputs.storePassword
                keyAlias releaseInputs.alias
                keyPassword releaseInputs.keyPassword
            }
        }
    }
    buildTypes {
        debug { versionNameSuffix '-debug' }
        release {
            debuggable false
            signingConfig signingConfigs.privateRelease
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Keep release opt-in: this provisional identity is authorized for private sideloading only.
// Google Play/public distribution still needs the separate identity and policy gates.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') }) {
        if (System.getenv('ADVERTIO_PRIVATE_RELEASE') != 'true') {
            throw new GradleException('Release blocked: explicitly authorize private sideload release.')
        }
        if (!hasInjectedVersion) {
            throw new GradleException('Release requires automatic GitHub Actions version metadata.')
        }
        if (!hasReleaseSigning) {
            throw new GradleException('Release blocked: external release signing inputs are required.')
        }
        def key = new File(releaseInputs.store)
        def candidateRoot = rootProject.projectDir.parentFile.parentFile.parentFile.canonicalFile
        def publicRoot = new File(candidateRoot, '.git').exists() ? candidateRoot : rootProject.projectDir.parentFile.canonicalFile
        if (!key.isAbsolute() || !key.isFile() || key.canonicalFile.toPath().startsWith(publicRoot.toPath())) {
            throw new GradleException('Release blocked: signing keystore must be an external absolute file.')
        }
        def web = new File(rootProject.projectDir.parentFile, 'www')
        if (!new File(web, 'index.html').isFile() || !new File(web, 'assets').isDirectory()) {
            throw new GradleException('Release blocked: build and sync the real private UI first.')
        }
    }
}
